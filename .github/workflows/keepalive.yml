name: Keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them via the API resets that timer, without any commits.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in snapshot.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done
